<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I LOVE AYRAH</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const PINK = "#DA79B9";

const textCanvas = document.createElement("canvas");
const textCtx = textCanvas.getContext("2d");

const TEXT_W = 800;
const TEXT_H = 300;
textCanvas.width = TEXT_W;
textCanvas.height = TEXT_H;

textCtx.fillStyle = "#000";
textCtx.fillRect(0, 0, TEXT_W, TEXT_H);

textCtx.font = "bold 100px Arial, sans-serif";
textCtx.fillStyle = PINK;
textCtx.textAlign = "left";
textCtx.textBaseline = "alphabetic";

const text = "I LOVE AYRAH";
const metrics = textCtx.measureText(text);
const textWidth = metrics.width;
const textX = (TEXT_W - textWidth) / 2;
const textY = (TEXT_H + 100) / 2 - 10;

textCtx.fillText(text, textX, textY);

const points = [];
const imageData = textCtx.getImageData(0, 0, TEXT_W, TEXT_H).data;

for (let py = 0; py < TEXT_H; py++) {
  for (let px = 0; px < TEXT_W; px++) {
    const idx = (py * TEXT_W + px) * 4;
    const r = imageData[idx];
    const g = imageData[idx + 1];
    const b = imageData[idx + 2];
    if (r > 20 || g > 20 || b > 20) {
      points.push({
        x: px - TEXT_W / 2,
        y: TEXT_H / 2 - py
      });
    }
  }
}

// Same idea as Python's points[::20]
const sampledPoints = [];
for (let i = 0; i < points.length; i += 20) {
  sampledPoints.push(points[i]);
}

console.log("Text points:", sampledPoints.length);

const NUM_STARS = Math.min(500, sampledPoints.length);
const FOCAL_LENGTH = 500;
const MAX_DEPTH = 1000;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

shuffle(sampledPoints);

const stars = [];

for (let i = 0; i < NUM_STARS; i++) {
  stars.push({
    x: Math.random() * 1400 - 700,
    y: Math.random() * 1000 - 500,
    z: 500 + Math.random() * 500,

    targetX: sampledPoints[i].x,
    targetY: sampledPoints[i].y,
    targetZ: -30 + Math.random() * 60,

    speed: 0.015 + Math.random() * 0.01,
    twinkle: Math.random() * Math.PI * 2
  });
}

function rotateY(x, y, z, angle) {
  const c = Math.cos(angle);
  const s = Math.sin(angle);

  return {
    x: x * c - z * s,
    y: y,
    z: x * s + z * c
  };
}

function project(x, y, z) {
  let cameraZ = z + 700;
  if (cameraZ < 50) cameraZ = 50;

  return {
    x: (x * FOCAL_LENGTH) / cameraZ,
    y: (y * FOCAL_LENGTH) / cameraZ
  };
}

let frame = 0;

const FORMATION_START = 100;
const FORMATION_END = 300;

function animate() {
  frame++;

  let rotation;

  if (frame < FORMATION_END) {
    rotation = 0;
  } else {
    rotation = Math.sin(frame * 0.015) * 0.35;
  }

  ctx.clearRect(0, 0, W, H);

  // Keep the coordinate system centered like Turtle.
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(1, -1);

  for (const star of stars) {

    // PHASE 1 — STARFIELD
    if (frame < FORMATION_START) {
      star.z -= 6;

      if (star.z < 100) {
        star.x = Math.random() * 1400 - 700;
        star.y = Math.random() * 1000 - 500;
        star.z = MAX_DEPTH;
      }
    }

    // PHASE 2 — FORM TEXT
    else if (frame < FORMATION_END) {
      star.x += (star.targetX - star.x) * star.speed;
      star.y += (star.targetY - star.y) * star.speed;
      star.z += (star.targetZ - star.z) * 0.02;
    }

    // PHASE 3 — HOLD TEXT
    else {
      star.x += (star.targetX - star.x) * 0.01;
      star.y += (star.targetY - star.y) * 0.01;
      star.z += (star.targetZ - star.z) * 0.01;
    }

    const rotated = rotateY(star.x, star.y, star.z, rotation);
    const projected = project(rotated.x, rotated.y, rotated.z);

    const twinkle =
      (Math.sin(frame * 0.08 + star.twinkle) + 1) / 2;

    let size = 1.8 + twinkle * 1.5;

    if (frame < FORMATION_END) {
      size = 1.5 + twinkle;
    }

    ctx.beginPath();
    ctx.arc(projected.x, projected.y, size, 0, Math.PI * 2);
    ctx.fillStyle = PINK;
    ctx.fill();
  }

  ctx.restore();

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
